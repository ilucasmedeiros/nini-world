<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>❤ Super Nini World — 2 em 1</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕹️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1226;
  --gold:#ffd000;
  --pink:#ff7bb1;
  --cyan:#7ff3ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Press Start 2P', monospace;
  background:radial-gradient(ellipse at 50% 40%, #1c1038 0%, #0a0616 60%, #000 100%);
  color:#fff;overflow-x:hidden;
  touch-action:manipulation;
  -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.hidden{display:none !important}
canvas{image-rendering:crisp-edges;image-rendering:pixelated}

/* ===== CRT ===== */
#crt{
  position:fixed;inset:0;pointer-events:none;z-index:20;
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,.25) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.7) 100%);
  animation:flicker 4s steps(1) infinite;
}
@keyframes flicker{0%,100%{opacity:1}47%{opacity:.93}48%{opacity:1}}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.star{position:absolute;width:2px;height:2px;background:#fff;animation:tw 2s steps(2) infinite}
@keyframes tw{50%{opacity:.15}}

/* ===== LAYOUT ===== */
#app{
  position:relative;z-index:1;min-height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  padding:28px 16px 70px;text-align:center;
}
.logo{line-height:1.25}
.logo .super{display:block;font-size:clamp(11px,2.6vw,16px);color:var(--cyan);letter-spacing:6px;text-shadow:2px 2px 0 #062a3a;margin-bottom:10px}
.logo .big{
  display:block;font-size:clamp(26px,7.4vw,58px);letter-spacing:2px;
  background:linear-gradient(#fff7b0 0%,#ffd23f 30%,#ff8a1f 55%,#ff4f7a 80%,#b44dff 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(4px 4px 0 #2a0610);
}
.subtitle{font-size:clamp(9px,2.3vw,13px);color:#fff;letter-spacing:2px}
.subtitle b{color:var(--gold);font-weight:normal}

/* ===== CARTUCHOS ===== */
.carts{display:flex;gap:44px;flex-wrap:wrap;justify-content:center;align-items:flex-end}
.slot{position:relative;padding-left:30px}
.cursor{position:absolute;left:0;top:50%;transform:translateY(-50%);font-size:20px;color:var(--gold);visibility:hidden;animation:blink .6s steps(2) infinite}
.slot.sel .cursor{visibility:visible}
@keyframes blink{50%{opacity:0}}
.cart{
  position:relative;width:min(290px,78vw);cursor:pointer;
  background:linear-gradient(90deg,#77778a,#a3a3b4 18%,#9494a6 82%,#6c6c80);
  border:4px solid var(--ink);border-radius:12px 12px 4px 4px;
  padding:30px 14px 14px;
  box-shadow:0 8px 0 var(--ink), inset 0 4px 0 rgba(255,255,255,.3), inset 0 -6px 0 rgba(0,0,0,.25);
  transition:transform .15s, filter .15s;filter:brightness(.82) saturate(.8);
}
.cart::before{
  content:"";position:absolute;top:9px;left:34px;right:34px;height:11px;border-radius:3px;
  background:repeating-linear-gradient(90deg,#5d5d70 0 5px,#b4b4c4 5px 9px);
}
.slot.sel .cart{transform:translateY(-12px);filter:none;box-shadow:0 8px 0 var(--ink), 0 0 0 4px var(--gold), 0 0 34px rgba(255,208,0,.35), inset 0 4px 0 rgba(255,255,255,.3), inset 0 -6px 0 rgba(0,0,0,.25)}
.label{
  position:relative;height:168px;border:4px solid var(--ink);overflow:hidden;
  display:flex;align-items:flex-end;justify-content:center;gap:10px;padding-bottom:30px;
}
.label .ltitle{
  position:absolute;top:10px;left:0;right:0;font-size:12px;line-height:1.4;
  color:#fff;text-shadow:3px 3px 0 var(--ink),-1px -1px 0 var(--ink);
}
/* rótulo 1: céu, chão e castelo */
.l1{background:linear-gradient(#5c94fc,#9cc6ff 80%)}
.l1::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:30px;
  background:repeating-linear-gradient(90deg, rgba(0,0,0,.15) 0 2px, transparent 2px 20px),linear-gradient(#e2954d,#b86b2e);
  border-top:4px solid #2f7d3a;
}
.l1 .cloud{position:absolute;top:58px;left:20px;width:46px;height:14px;background:#fff;border-radius:14px}
.l1 .cloud::before{content:"";position:absolute;left:8px;top:-9px;width:20px;height:20px;background:#fff;border-radius:50%}
.l1 .cloud.c2{left:auto;right:18px;top:70px;transform:scale(.8)}
/* rótulo 2: fogo de luta */
.l2{background:radial-gradient(ellipse at 50% 100%, #ffd23f 0%, #ff8a1f 30%, #e8283c 60%, #3a0a3e 100%)}
.l2::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:30px;
  background:repeating-linear-gradient(90deg,#3a3842 0 18px,#4a4652 18px 20px);
  border-top:4px solid #22202a;
}
.l2 .vs{font-size:20px;color:#ffd23f;text-shadow:3px 3px 0 #a01830,-1px -1px 0 #000;align-self:center;margin-bottom:-10px}
.label canvas,.label .spr{position:relative;z-index:1}
.heart{font-size:20px;align-self:center;margin-bottom:6px;z-index:1;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.25)}}
.badge{
  position:absolute;top:-14px;right:-14px;z-index:3;font-size:9px;padding:7px 8px;
  background:#ff3b3b;border:3px solid var(--ink);box-shadow:3px 3px 0 rgba(0,0,0,.4);
  transform:rotate(8deg);animation:badge .7s steps(2) infinite;
}
@keyframes badge{50%{background:var(--gold);color:var(--ink)}}
.sticker{margin-top:12px;background:#f4ecd8;border:3px solid var(--ink);padding:9px 8px;color:var(--ink)}
.sticker .t{font-size:11px;line-height:1.5}
.sticker .m{font-family:'VT323',monospace;font-size:19px;color:#6b5a8e;margin-top:4px}

.hint{font-size:8px;color:#9d8cc4;line-height:2}
.k{font-family:"VT323",monospace;font-size:17px;line-height:0;vertical-align:-1px;color:var(--gold)}
.press{font-size:10px;color:var(--gold);animation:blink 1.1s steps(2) infinite}
footer{position:fixed;bottom:12px;left:0;right:0;z-index:2;text-align:center;font-size:8px;color:#6b5a8e}
footer b{color:var(--pink);font-weight:normal}

#flash{position:fixed;inset:0;z-index:30;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s}
#flash.on{opacity:1}
#loading{position:fixed;inset:0;z-index:31;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink);pointer-events:none}

@media (max-width:700px){
  .carts{gap:30px}
  .label{height:150px}
}
</style>
</head>
<body>
<div id="stars"></div>
<div id="crt"></div>

<div id="app">
  <h1 class="logo">
    <span class="super">SUPER</span>
    <span class="big">NINI WORLD</span>
  </h1>
  <div class="subtitle"><b>2 EM 1</b> · SELECIONE O JOGO</div>

  <div class="carts">
    <div class="slot sel" data-href="namorados.html">
      <span class="cursor">▶</span>
      <div class="cart">
        <div class="label l1">
          <span class="ltitle">NOSSA<br>HISTÓRIA</span>
          <div class="cloud"></div><div class="cloud c2"></div>
          <canvas id="sprHero"></canvas>
          <span class="heart">💖</span>
          <canvas id="sprPrincess"></canvas>
        </div>
        <div class="sticker">
          <div class="t">DIA DOS NAMORADOS</div>
          <div class="m">AVENTURA · 1 JOGADOR</div>
        </div>
      </div>
    </div>

    <div class="slot" data-href="aniversario.html">
      <span class="cursor">▶</span>
      <div class="cart">
        <span class="badge">NOVO!</span>
        <div class="label l2">
          <span class="ltitle">NINI<br>FIGHTER II</span>
          <canvas id="sprNini"></canvas>
          <span class="vs">VS</span>
          <canvas id="sprChat"></canvas>
        </div>
        <div class="sticker">
          <div class="t">EDIÇÃO ANIVERSÁRIO</div>
          <div class="m">LUTA · 1 JOGADOR</div>
        </div>
      </div>
    </div>
  </div>

  <div class="press" id="press">APERTE START</div>
  <div class="hint" id="hint"><span class="k">← →</span> ESCOLHER · ENTER JOGAR</div>
</div>

<footer>© 2026 <b>LUCAS ❤ RAQUEL</b> · INSERT COIN</footer>
<div id="flash"></div>
<div id="loading" class="hidden">CARREGANDO...</div>

<script>
// ---------- pixel-art (mesmos grids dos jogos) ----------
const sym = rows => rows.map(r => r + [...r].reverse().join(""));
function drawGrid(x, grid, pal, gx, gy, px){
  grid.forEach((row, r) => {
    for (let i = 0; i < row.length; i++){
      const ch = row[i];
      if (ch === ".") continue;
      const col = pal[ch];
      if (!col) continue;
      x.fillStyle = col;
      x.fillRect((gx+i)*px, (gy+r)*px, px, px);
    }
  });
}
function sprite(id, parts, w, h, px, flipX){
  const c = document.getElementById(id), x = c.getContext("2d");
  c.width = w*px; c.height = h*px;
  if (flipX){ x.translate(c.width, 0); x.scale(-1, 1); }
  parts.forEach(([grid, pal, gx, gy]) => drawGrid(x, grid, pal, gx, gy, px));
}

// LUCAS e a PRINCESA (do jogo "Nossa História")
const HERO_A = [
"...HHHHHH...",
"..HHHHHHHH..",
".HHHHHHHHHH.",
".HHSSSSSSHH.",
"..KWWKKWWK..",
"..SSSSSSSS..",
"..SSSMMSSS..",
"...SSSSSS...",
".TTTTTTTTTT.",
".TTTTTTTTTT.",
".SSTTTTTTSS.",
"..TTTTTTTT..",
"...DDDDDD...",
"...DD..DD...",
"...DD..DD...",
"..KKK..KKK.."];
const HERO_PAL = {H:"#3a2817", S:"#ffc7a0", K:"#20232a", T:"#2e2e38", D:"#3566c4", W:"#e8f2fa", M:"#d99873"};
const PRINCESS = [
"...Y.YY.Y...",
"...YYYYYY...",
"..HHHHHHHH..",
".HHHHHHHHHH.",
".HHSSSSSSHH.",
".HHSKSSKSHH.",
".HHSSSSSSHH.",
".HYSSRRSSYH.",
".HHSSSSSSHH.",
".HHPPPPPPHH.",
".HHPPPPPPHH.",
".SSPPPPPPSS.",
"..PPPPPPPP..",
".PPPPPPPPPP.",
".PPPPPPPPPP.",
"PPPPPPPPPPPP"];
const PRINCESS_PAL = {Y:"#ffd400", H:"#3a2817", S:"#ffc7a0", K:"#20232a", R:"#e0436b", P:"#ff7bb1", W:"#e8f2fa"};

// NINI e CHATINHA (do jogo "Nini Fighter II")
const NINI_PAL = {o:"#1b1519", L:"#d9d2c5", l:"#a89f92", m:"#b9a890", a:"#5a534b", g:"#6e675f", G:"#403b37",
  E:"#0d0b0e", e:"#ffffff", N:"#141214", T:"#fffaf0", M:"#5a1420"};
const NINI_HEAD = sym([
"......ooooo",
"....ooLlLLL",
"...oLLLLLLL",
"..oLLLLlLLL",
".oGLLLLLLLL",
"oGgLLLLLLLL",
"oGglaaaLLLL",
"oGgaEEeaLLL",
"oGgaEEEalLL",
"oGglaaalLLL",
"oGgglLLLlLN",
"oGgglLLmlNN",
"oGGgglmmlTT",
"oGGgglmmmMM",
"oGGGgolmmmm",
".oGGGoommmm",
"..oGGo.oomm",
"...oo....oo"]);
const CH_PAL = {o:"#050407", L:"#4a4654", l:"#35323d", m:"#3b3844", a:"#141318", g:"#26242c", G:"#18171c",
  e:"#ffffff", R:"#ff2d4a", N:"#000000", T:"#fffaf0", M:"#5a1420", B:"#ff3d6a", b:"#a8173a"};
// chatinha: a mesma shih-tzu, toda pretinha, brava e de lacinho
const CHAT_HEAD = sym([
"......ooooo",
"....ooLlLLL",
"...oLLLLLLL",
"..oLLLLlLLL",
".oGLLLLLLLL",
"oGgooLLLLLL",
"oGglLoooLLL",
"oGgaRReaLLL",
"oGgaRRRalLL",
"oGglaaalLLL",
"oGgglLLLlLN",
"oGgglLLmlNN",
"oGGgglmmlTT",
"oGGgglmmmMM",
"oGGGgolmmmm",
".oGGGoommmm",
"..oGGo.oomm",
"...oo....oo"]);
const BOW = ["oo...oo", "oBo.oBo", "obBoBbo", "oBo.oBo", "oo...oo"];

sprite("sprHero", [[HERO_A, HERO_PAL, 0, 0]], 12, 16, 5);
sprite("sprPrincess", [[PRINCESS, PRINCESS_PAL, 0, 0]], 12, 16, 5);
sprite("sprNini", [[NINI_HEAD, NINI_PAL, 0, 0]], 22, 18, 4);
sprite("sprChat", [[CHAT_HEAD, CH_PAL, 0, 3], [BOW, CH_PAL, 8, 0]], 22, 21, 4, true);

// ---------- estrelas ----------
const stars = document.getElementById("stars");
for (let i = 0; i < 70; i++){
  const s = document.createElement("span");
  s.className = "star";
  s.style.left = (Math.random()*100) + "%";
  s.style.top = (Math.random()*100) + "%";
  s.style.animationDelay = (Math.random()*2) + "s";
  s.style.animationDuration = (1.4 + Math.random()*2) + "s";
  if (Math.random() < .2){ s.style.width = s.style.height = "3px"; }
  stars.appendChild(s);
}

// ---------- som (webaudio, 8-bit) ----------
let actx = null;
function ac(){
  if (!actx) try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
  if (actx && actx.state === "suspended") actx.resume();
  return actx;
}
function beep(freq, delay, dur, type, vol){
  const c = ac(); if (!c) return;
  try{
    const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + delay;
    o.type = type || "square"; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || .05, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + .02);
  }catch(e){}
}
const sCursor = () => beep(880, 0, .06, "square", .04);
const sStart = () => { [523, 659, 784, 1047, 1319].forEach((f, i) => beep(f, i*.08, .16)); };

// ---------- seleção ----------
const slots = [...document.querySelectorAll(".slot")];
let sel = 0, going = false;
function select(i, sound){
  if (going) return;
  i = (i + slots.length) % slots.length;
  if (i !== sel && sound) sCursor();
  sel = i;
  slots.forEach((s, k) => s.classList.toggle("sel", k === sel));
}
function go(){
  if (going) return;
  going = true;
  sStart();
  const flash = document.getElementById("flash");
  setTimeout(() => flash.classList.add("on"), 250);
  setTimeout(() => document.getElementById("loading").classList.remove("hidden"), 600);
  setTimeout(() => { location.href = slots[sel].dataset.href; }, 900);
}
slots.forEach((s, i) => {
  s.addEventListener("mouseenter", () => select(i, true));
  s.addEventListener("click", () => { ac(); select(i, false); go(); });
});
document.addEventListener("keydown", e => {
  if (["ArrowLeft", "ArrowUp", "KeyA", "KeyW"].includes(e.code)){ e.preventDefault(); ac(); select(sel - 1, true); }
  else if (["ArrowRight", "ArrowDown", "KeyD", "KeyS"].includes(e.code)){ e.preventDefault(); ac(); select(sel + 1, true); }
  else if (e.code === "Enter" || e.code === "Space"){ e.preventDefault(); ac(); go(); }
});
// voltando pelo botão "voltar" do navegador, a página pode vir do cache
window.addEventListener("pageshow", () => {
  going = false;
  document.getElementById("flash").classList.remove("on");
  document.getElementById("loading").classList.add("hidden");
});
if (("ontouchstart" in window) || (window.matchMedia && matchMedia("(pointer:coarse)").matches)){
  document.getElementById("press").textContent = "TOQUE NUM CARTUCHO";
  document.getElementById("hint").classList.add("hidden");
}
</script>
</body>
</html>
